# House hooks run via `prek` (`uv run prek install` once per clone).
# Python side mirrors seared's chain (lint, format, dep hygiene, ty); the Rust
# side adds fmt + clippy. Deliberately no build and no test run — compiling and
# the differential suite are CI's job, not a commit hook's. `no-commit-to-branch`
# refuses a commit on `master`, which moves only by merging a `version/` branch
# (see README Development); it is prek's built-in copy, so nothing is fetched.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: deptry
        name: deptry
        entry: uv run deptry .
        language: system
        pass_filenames: false
        types: [python]
      - id: ty-check
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
  - repo: builtin
    hooks:
      - id: no-commit-to-branch  # master moves only by merge
